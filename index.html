<html lang="en" data-theme="light">
<head>

  <title>Toxico — Clinical Toxicology Resources</title>
  <meta name="description" content="Clinical toxicology course bookmarks, lecture links, research papers, and antivenom clinical guidelines.">
  <meta property="og:title" content="Toxico — Clinical Toxicology Resources">
  <meta property="og:description" content="Clinical toxicology course bookmarks, lecture links, research papers, and antivenom clinical guidelines.">
  <meta name="theme-color" content="#F3F1EC" id="meta-theme-color">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B93421'/%3E%3Cpath d='M12.5 6h7a1 1 0 0 1 1 1v1.5a1 1 0 0 1-1 1h-.7v2.8l5.6 9.8A2.5 2.5 0 0 1 22.2 26H9.8a2.5 2.5 0 0 1-2.2-3.9l5.6-9.8V9.5h-.7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z' fill='%23ffffff'/%3E%3Crect x='14.6' y='15.7' width='2.8' height='6.6' rx='0.6' fill='%23B93421'/%3E%3Crect x='12.7' y='17.6' width='6.6' height='2.8' rx='0.6' fill='%23B93421'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23B93421'/%3E%3Cpath d='M12.5 6h7a1 1 0 0 1 1 1v1.5a1 1 0 0 1-1 1h-.7v2.8l5.6 9.8A2.5 2.5 0 0 1 22.2 26H9.8a2.5 2.5 0 0 1-2.2-3.9l5.6-9.8V9.5h-.7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z' fill='%23ffffff'/%3E%3Crect x='14.6' y='15.7' width='2.8' height='6.6' rx='0.6' fill='%23B93421'/%3E%3Crect x='12.7' y='17.6' width='6.6' height='2.8' rx='0.6' fill='%23B93421'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('toxico_theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved;
        } else {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        }
      } catch (_) {}
    })();
  </script>
  <style>
    :root,
    [data-theme="light"] {
      color-scheme: light;
      --font-display: 'Outfit', 'IBM Plex Sans Thai', sans-serif;
      --font-sans: 'Plus Jakarta Sans', 'IBM Plex Sans Thai', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* High-Contrast Alabaster & Carbon Ink Palette (WCAG AA compliant, accent contrast ratio 5.15:1 against canvas) */
      --bg-canvas: #F3F1EC;
      --bg-menu: rgba(255, 255, 255, 0.94);
      --bg-elevated: #FFFFFF;
      --bg-subtle: #E6E3DC;
      --bg-hover: #FFFFFF;
      --bg-visited: #EAE7E0;
      --ink-primary: #121211;
      --ink-secondary: #43423F;
      --ink-muted: #65635E;
      --line: #D5D1C8;
      --line-strong: #ACA79C;
      --line-hover: #121211;

      /* Controlled Clinical Accent darkened to meet >=4.5:1 WCAG AA (measured 5.15:1 against #F3F1EC) */
      --accent: #B93421;
      --accent-soft: rgba(185, 52, 33, 0.14);
      --shadow-card: 0 1px 2px rgba(18, 18, 17, 0.05);
      --shadow-card-hover: 0 4px 12px rgba(18, 18, 17, 0.08);
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-canvas: #0B0B0A;
      --bg-menu: rgba(20, 20, 19, 0.94);
      --bg-elevated: #171715;
      --bg-subtle: #232320;
      --bg-hover: #1F1F1C;
      --bg-visited: #121210;
      --ink-primary: #F5F3EE;
      --ink-secondary: #C2BFB8;
      --ink-muted: #8E8B84;
      --line: #2E2E2A;
      --line-strong: #4A4943;
      --line-hover: #F5F3EE;

      --accent: #E85D4A;
      --accent-soft: rgba(232, 93, 74, 0.2);
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.35);
      --shadow-card-hover: 0 6px 16px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: clip;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: clip;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Screen-reader accessible utility */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Sticky High-Contrast Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-menu);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .top-bar-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 0.75rem clamp(1.25rem, 3vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand-wordmark {
      font-family: var(--font-display);
      font-size: 1.02rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      cursor: pointer;
      transition: color 0.15s var(--ease);
    }

    .brand-wordmark:hover {
      color: var(--accent);
    }

    /* Segmented Menu Rail */
    .top-nav {
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.22rem;
      background: var(--bg-subtle);
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .top-nav a {
      color: var(--ink-secondary);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      padding: 0.34rem 0.8rem;
      border-radius: 6px;
      transition: color 0.15s var(--ease), background-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }

    .top-nav a:hover {
      color: var(--ink-primary);
      background: color-mix(in srgb, var(--bg-elevated) 60%, transparent);
    }

    .top-nav a.is-active {
      color: var(--bg-elevated);
      background: var(--ink-primary);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.14);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .search-box {
      position: relative;
      width: 240px;
    }

    .search-box svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 0.88rem;
      height: 0.88rem;
      color: var(--ink-secondary);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 0.42rem 2rem 0.42rem 2.05rem;
      border-radius: 6px;
      border: 1px solid var(--line-strong);
      background: var(--bg-elevated);
      color: var(--ink-primary);
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      box-shadow: var(--shadow-card);
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }

    .search-box input::placeholder {
      color: var(--ink-muted);
      font-weight: 400;
    }

    .search-box input:focus {
      outline: none;
      border-color: var(--ink-primary);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-box input:focus ~ .search-kbd,
    .search-box input:not(:placeholder-shown) ~ .search-kbd {
      display: none;
    }

    .search-kbd {
      position: absolute;
      right: 0.45rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--ink-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.05rem 0.35rem;
      pointer-events: none;
    }

    /* High-Contrast Tactile Action Buttons */
    .btn-ghost {
      background: var(--bg-elevated);
      border: 1px solid var(--line-strong);
      color: var(--ink-primary);
      cursor: pointer;
      padding: 0.42rem 0.75rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.38rem;
      font-size: 0.78rem;
      font-family: inherit;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
      box-shadow: var(--shadow-card);
      transition: color 0.15s var(--ease), border-color 0.15s var(--ease), background-color 0.15s var(--ease), transform 0.1s var(--ease);
    }

    .btn-ghost:hover,
    .btn-ghost.is-active {
      color: var(--bg-elevated);
      border-color: var(--ink-primary);
      background: var(--ink-primary);
    }

    .btn-ghost.is-confirming {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    [data-theme="dark"] .btn-ghost.is-confirming {
      color: #121211;
    }

    .btn-ghost:active {
      transform: translateY(1px);
    }

    .btn-ghost.is-active svg {
      fill: currentColor;
    }

    .btn-ghost:focus-visible,
    .fav-btn:focus-visible,
    .card-link:focus-visible,
    .top-nav a:focus-visible,
    .section-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-ghost svg {
      width: 0.88rem;
      height: 0.88rem;
    }

    /* Main Container with Continuous Background Vertical Line */
    .page-shell {
      position: relative;
      max-width: 1160px;
      margin: 0 auto;
      padding: clamp(2rem, 4vw, 3.25rem) clamp(1.25rem, 3vw, 2.5rem) 0;
      scroll-margin-top: 4.75rem;
    }

    /* Single Unbroken Vertical Progress Line Behind Content */
    .spine-track {
      position: absolute;
      left: clamp(2.25rem, 5vw, 3.75rem);
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--line-strong);
      z-index: 0;
      pointer-events: none;
    }

    .spine-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 0px;
      background: var(--accent);
    }

    /* Section Architecture Overlapping the Vertical Line */
    .section {
      position: relative;
      z-index: 2;
      scroll-margin-top: 4.75rem;
      display: block;
      margin-bottom: clamp(3.25rem, 5.5vw, 4.5rem);
    }

    .section:last-of-type {
      margin-bottom: 0;
    }

    .section-header {
      position: relative;
      z-index: 2;
      background-color: var(--bg-canvas);
      padding: 0.5rem 0 0.85rem 0;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      border-radius: 4px;
      transition: border-color 0.25s var(--ease), background-color 0.2s var(--ease), margin-bottom 0.2s var(--ease);
    }

    .section-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.3rem;
    }

    .spine-kicker {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      font-variant-numeric: tabular-nums;
      transition: color 0.1s var(--ease);
    }

    .spine-title {
      font-family: var(--font-display);
      font-size: clamp(1.25rem, 1.9vw, 1.5rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.25;
      color: var(--ink-secondary);
      transition: color 0.1s var(--ease);
    }

    /* Unstyled Accessible Section Button (A2) */
    .section-toggle {
      background: transparent;
      border: none;
      font: inherit;
      color: inherit;
      text-align: left;
      padding: 0;
      margin: 0;
      cursor: pointer;
      width: 100%;
      display: block;
      border-radius: 4px;
    }

    .section-toggle:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .section.is-collapsed {
      margin-bottom: clamp(1.5rem, 3vw, 2.25rem);
    }

    .section.is-collapsed .section-header {
      margin-bottom: 0;
    }

    .section.is-collapsed .section-content {
      display: none;
    }

    .section-meta {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Reached & Active Section States */
    .section.is-border-reached .section-header {
      border-bottom-color: var(--line-strong);
    }

    .spine-kicker.is-reached {
      color: var(--accent);
    }

    .section.is-reached .spine-title {
      color: var(--ink-primary);
    }

    .section.is-active .spine-title {
      color: var(--accent);
    }

    .section-content {
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    /* Sub-Topic Headings */
    h3 {
      position: relative;
      z-index: 2;
      font-family: var(--font-sans);
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink-secondary);
      background-color: var(--bg-canvas);
      margin: 1.85rem 0 0.75rem 0;
      padding: 0.22rem 0.65rem 0.22rem 0;
      display: flex;
      width: fit-content;
      max-width: 100%;
      align-items: baseline;
      gap: 0.5rem;
      transition: color 0.1s var(--ease), background-color 0.2s var(--ease);
    }

    h3:first-of-type {
      margin-top: 0.15rem;
    }

    h3.is-reached {
      color: var(--ink-primary);
    }

    .topic-index {
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 600;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
      transition: color 0.1s var(--ease);
    }

    h3.is-reached .topic-index {
      color: var(--accent);
    }

    /* 3-Column High-Contrast Card Grid */
    .links-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.7rem;
    }

    /* Accessible Card Component (A1) */
    .link-card {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.8rem 1rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow-card);
      color: var(--ink-primary);
      font-size: 0.86rem;
      font-weight: 500;
      line-height: 1.42;
      transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease), color 0.15s var(--ease);
    }

    .link-card:hover {
      background-color: var(--bg-hover);
      border-color: var(--line-hover);
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-1px);
    }

    .link-card:focus-within {
      border-color: var(--ink-primary);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    .card-link {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      min-width: 0;
      flex: 1;
      color: inherit;
      text-decoration: none;
    }

    /* Pseudo-element makes whole card area clickable */
    .card-link::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 8px;
    }

    .card-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .card-left {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      min-width: 0;
      flex: 1;
    }

    .link-card svg.card-icon {
      width: 0.92rem;
      height: 0.92rem;
      flex-shrink: 0;
      color: var(--ink-secondary);
      transform: translateY(2px);
      transition: color 0.15s var(--ease);
    }

    .link-card:hover svg.card-icon {
      color: var(--accent);
    }

    .card-content {
      flex: 1;
      overflow-wrap: anywhere;
    }

    /* Card Favorite Star Button (Accessible Hit Target & Stacking) */
    .fav-btn {
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      width: 2.2rem;
      height: 2.2rem;
      padding: 0;
      margin: -0.45rem -0.45rem -0.45rem 0;
      border-radius: 6px;
      color: var(--ink-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.45;
      transition: color 0.15s var(--ease), opacity 0.15s var(--ease), transform 0.12s var(--ease);
    }

    .link-card:hover .fav-btn,
    .fav-btn:focus-visible {
      opacity: 0.85;
    }

    .fav-btn:hover {
      opacity: 1 !important;
      color: var(--accent);
      transform: scale(1.12);
    }

    .fav-btn.is-favorite {
      opacity: 1;
      color: var(--accent);
    }

    .fav-btn svg {
      width: 0.95rem;
      height: 0.95rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fav-btn.is-favorite svg {
      fill: currentColor;
    }

    /* Unboxed Quiet Metadata Indicators */
    .tag-new {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--accent);
      margin-left: 0.4rem;
      white-space: nowrap;
    }

    .tag-new::before {
      content: "· ";
    }

    /* Visited State */
    .link-card.visited {
      background-color: var(--bg-visited);
      border-color: var(--line);
      box-shadow: none;
      color: var(--ink-secondary);
    }

    .link-card.visited:hover {
      border-color: var(--line-strong);
      color: var(--ink-primary);
    }

    .link-card.visited svg.card-icon {
      color: var(--ink-muted);
    }

    .tag-visited {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      color: var(--ink-muted);
      margin-left: 0.4rem;
      white-space: nowrap;
    }

    .tag-visited::before {
      content: "· ";
    }

    /* Empty Search State */
    .empty-state {
      position: relative;
      z-index: 2;
      display: none;
      padding: 3rem 1rem;
      text-align: center;
      background-color: var(--bg-elevated);
      color: var(--ink-secondary);
      font-size: 0.9rem;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
    }

    .empty-state button {
      margin-top: 0.75rem;
    }

    /* Bottom Spine Runway & Minimalist Centered Cat Scene */
    .spine-finale {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: clamp(2.5rem, 4.5vw, 4rem);
      padding: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .finale-character-wrap {
      position: relative;
      display: block;
      width: clamp(340px, 54vw, 520px);
      margin: 0 auto;
      flex-shrink: 0;
    }

    .finale-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    /* Minimalist Finale Scene Animations & Interactive States */
    @keyframes tailPendulum {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes eyeBlink {
      0%, 45%, 48%, 100% { transform: scaleY(1); }
      46.5% { transform: scaleY(0.08); }
    }
    @keyframes bubbleFloat {
      0% { transform: translateY(0) scale(0.9); opacity: 0; }
      30% { opacity: 0.85; }
      80% { opacity: 0.55; }
      100% { transform: translateY(-16px) scale(1.08); opacity: 0; }
    }

    .svg-tail {
      transform-box: fill-box;
      transform-origin: 90% 85%;
      animation: tailPendulum 3.6s ease-in-out infinite;

    // 2. LocalStorage Helpers (Backward-Compatible & Collision-Safe)
    function legacyNormalizeKey(rawUrl) {
      if (typeof rawUrl !== 'string') return '';
      const stripped = rawUrl.replace(/^https?:\/\/[^/]+\//, '').replace(/^\//, '');
      try {
        return decodeURI(stripped);
      } catch (_) {
        return stripped;
      }
    }

    function normalizeKey(rawUrl) {
      if (typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim().replace(/^\//, '');
      try {
        return decodeURI(trimmed);
      } catch (_) {
        return trimmed;
      }
    }

    // Map legacy stripped keys (e.g. "watch?v=...") to canonical keys on load (D4)
    const legacyToCanonicalMap = new Map();
    SECTIONS_DATA.forEach(sec => {
      sec.groups.forEach(group => {
        group.items.forEach(item => {
          const canonical = item.id || normalizeKey(item.href);
          const legacy = legacyNormalizeKey(item.href);
          legacyToCanonicalMap.set(legacy, canonical);
          legacyToCanonicalMap.set(canonical, canonical);
          if (item.href) {
            legacyToCanonicalMap.set(normalizeKey(item.href), canonical);
            legacyToCanonicalMap.set(encodeURI(item.href), canonical);
          }
        });
      });
    });

    // Explicit backward compatibility aliases for renamed resources
    const thaiPdfCanonical = 'pdfs/วิธีให้ Antivenom neurotoxin Snake.pdf';
    legacyToCanonicalMap.set('pdfs/วิธีให้ Antivenom neurototoxin Snake.docx.pdf', thaiPdfCanonical);
    legacyToCanonicalMap.set('pdfs/วิธีให้%20Antivenom%20neurototoxin%20Snake.docx.pdf', thaiPdfCanonical);
    const plosNew = normalizeKey('https://journals.plos.org/plosntds/article?id=10.1371/journal.pntd.0002302');
    legacyToCanonicalMap.set('https://journals.plos.org/plosntds/article/figures?id=10.1371/journal.pntd.0002302', plosNew);
    legacyToCanonicalMap.set('plosntds/article/figures?id=10.1371/journal.pntd.0002302', plosNew);

    function loadStoredSet(storageKey) {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
        if (Array.isArray(parsed)) {
          return new Set(
            parsed
              .map(val => legacyToCanonicalMap.get(val) || legacyToCanonicalMap.get(legacyNormalizeKey(val)) || normalizeKey(val))
              .filter(Boolean)
          );
        }
      } catch (_) {}
      return new Set();
    }

    function saveStoredSet(storageKey, set) {

        localStorage.setItem(storageKey, JSON.stringify(Array.from(set)));

    }

    const sunIcon = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
    const moonIcon = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';

    function setTheme(theme, persist) {
      const resolved = theme === 'dark' ? 'dark' : 'light';
      htmlElem.setAttribute('data-theme', resolved);
      if (themeIcon) themeIcon.innerHTML = resolved === 'dark' ? sunIcon : moonIcon;
      if (metaThemeColor) metaThemeColor.setAttribute('content', resolved === 'dark' ? '#0B0B0A' : '#F3F1EC');
      if (persist) {
        try {
          localStorage.setItem('toxico_theme', resolved);

      if (motionQuery.matches) {
        setTheme(next, true);
      } else if (typeof document.startViewTransition === 'function') {
        try {
          document.startViewTransition(() => setTheme(next, true));
        } catch (_) {
          setTheme(next, true);
        }
      } else {
        htmlElem.classList.add('theme-switching');
        setTheme(next, true);

    // 4. Render DOM from Data (A1, A2, A3, D3, D4)
    const sectionsRoot = document.getElementById('sections-root');

    function escapeHtml(str) {
      return (str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Helper: Wrap Thai script matches in lang="th" (A3)
    function renderWithLang(text) {
      const hasThai = /[\u0E00-\u0E7F]/.test(text);
      const escaped = escapeHtml(text);
      return hasThai ? `<span lang="th">${escaped}</span>` : escaped;
    }

    // Helper: Check if added date is within NEW_DAYS (D3)
    function isItemNew(addedDateStr) {
      if (!addedDateStr) return false;
      const addedTime = new Date(addedDateStr).getTime();
      if (isNaN(addedTime)) return false;
      const diffDays = (Date.now() - addedTime) / (1000 * 60 * 60 * 24);
      return diffDays >= 0 && diffDays <= NEW_DAYS;
    }

    sectionsRoot.innerHTML = SECTIONS_DATA.map(sec => {

                <svg aria-hidden="true"><use href="#icon-star"></use></svg>
              </button>
            </div>`;
        }).join('');

        return `
          <h3 data-search="${escapeHtml(`${group.index} ${group.title}`.toLowerCase())}"><span class="topic-index">${escapeHtml(group.index)}</span> ${renderWithLang(group.title)}</h3>
          <div class="links-grid">${cardsHtml}</div>`;
      }).join('');

      return `
        <section id="${sec.id}" class="section">
          <header class="section-header" title="Toggle section">
            <div class="section-header-top">
              <span class="spine-kicker">${escapeHtml(sec.kicker)}</span>
              <span class="section-meta" data-unit="${escapeHtml(sec.unit)}"></span>

                ${renderWithLang(sec.title)}

          </header>
          <div class="section-content" id="${contentId}">${groupsHtml}</div>
        </section>`;
    }).join('');

    // 5. Cache DOM Descriptors Once
    const topBar = document.querySelector('.top-bar');
    const pageShell = document.getElementById('top');
    const brandLink = document.querySelector('.brand-wordmark');
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const favoritesFilterBtn = document.getElementById('favorites-filter-btn');
    const resetHistoryBtn = document.getElementById('reset-history-btn');
    const resetHistoryLabel = document.getElementById('reset-history-label');
    const emptyState = document.getElementById('empty-state');
    const emptyStateText = emptyState.querySelector('p');
    const spineTrack = document.querySelector('.spine-track');
    const spineFill = document.getElementById('spine-fill');
    const spineFinale = document.getElementById('spine-finale');
    const finaleWrap = document.getElementById('finale-character-wrap');
    const finaleSvg = document.getElementById('finale-svg');
    const finaleBranchTrack = document.getElementById('finale-branch-track');
    const finaleBranchRight = document.getElementById('finale-branch-fill-right');
    const finaleSpineNode = document.getElementById('finale-spine-node');
    const navLinks = Array.from(document.querySelectorAll('.top-nav a'));
    const allHeadings = Array.from(document.querySelectorAll('.section-content h3'));
    const linkCards = Array.from(document.querySelectorAll('.link-card'));

    const HEADER_OFFSET_GAP = 20;
    const TAIL_SCROLL_RUNWAY = 180;
    const SVG_VIEWBOX_WIDTH = 480;
    const SVG_VIEWBOX_HEIGHT = 208;
    let tailStartScrollY = 0;

    function getTopBarOffset() {
      const barHeight = topBar ? topBar.getBoundingClientRect().height : 56;
      return Math.round(barHeight + HEADER_OFFSET_GAP);
    }

    function syncFinaleSpineAlignment() {
      if (!spineTrack || !spineFinale || !finaleSvg || spineFinale.style.display === 'none') return;
      const trackRect = spineTrack.getBoundingClientRect();
      const svgRect = finaleSvg.getBoundingClientRect();
      if (!svgRect.width) return;

      const spineCenterPx = trackRect.left + trackRect.width * 0.5;
      const scaleX = SVG_VIEWBOX_WIDTH / svgRect.width;
      const spineSvgX = Math.round((spineCenterPx - svgRect.left) * scaleX * 10) / 10;

      if (finaleSpineNode) {
        finaleSpineNode.setAttribute('cx', spineSvgX);
      }

      // Calculate right screen edge in SVG coordinate space so the line stretches all the way across to the viewport edge
      const screenRightSvgX = Math.max(
        SVG_VIEWBOX_WIDTH,
        Math.round((window.innerWidth - svgRect.left) * scaleX + 120)
      );
      const branchPath = `M ${spineSvgX} 150 H ${screenRightSvgX}`;
      if (finaleBranchTrack) finaleBranchTrack.setAttribute('d', branchPath);
      if (finaleBranchRight) finaleBranchRight.setAttribute('d', branchPath);
    }

    const sectionRecords = Array.from(document.querySelectorAll('.section')).map(el => ({
      id: el.id,
      el,
      header: el.querySelector('.section-header'),
      toggleBtn: el.querySelector('.section-toggle'),
      kicker: el.querySelector('.spine-kicker'),
      title: el.querySelector('.spine-title'),
      meta: el.querySelector('.section-meta'),
      groups: Array.from(el.querySelectorAll('.links-grid')).map(grid => ({
        grid,
        heading: grid.previousElementSibling,
        cards: Array.from(grid.querySelectorAll('.link-card'))
      })),
      allCards: Array.from(el.querySelectorAll('.link-card'))
    }));

    function updateBottomRunway() {
      if (!pageShell || !spineFinale) return;
      const targetOffset = getTopBarOffset();
      const visibleRecords = sectionRecords.filter(r => r.el.style.display !== 'none');

      if (visibleRecords.length === 0) {
        spineFinale.style.display = 'none';
        tailStartScrollY = 0;
        if (spineTrack) spineTrack.style.bottom = '0px';
        return;
      }

      spineFinale.style.display = 'flex';
      syncFinaleSpineAlignment();

      const lastRecord = visibleRecords[visibleRecords.length - 1];
      const lastHeaderEl = lastRecord.header || lastRecord.el;
      const lastHeaderRect = lastHeaderEl.getBoundingClientRect();
      const lastHeaderDocTop = window.scrollY + lastHeaderRect.top;
      const anchorViewportY = targetOffset + (lastHeaderRect.height || 68);

      const visibleH3s = allHeadings.filter(h3 => h3.style.display !== 'none' && h3.offsetParent !== null);
      const lastSubheading = visibleH3s.length > 0 ? visibleH3s[visibleH3s.length - 1] : null;
      const lastSubDocTop = lastSubheading
        ? window.scrollY + lastSubheading.getBoundingClientRect().top
        : lastHeaderDocTop;

      const lastHeaderTargetScrollY = Math.max(0, lastHeaderDocTop - targetOffset);
      const lastSubTargetScrollY = lastSubheading
        ? Math.max(lastHeaderTargetScrollY, lastSubDocTop - anchorViewportY + 28)
        : lastHeaderTargetScrollY;

      tailStartScrollY = lastSubTargetScrollY;
      const requiredMaxScroll = tailStartScrollY + TAIL_SCROLL_RUNWAY;
      const requiredDocHeight = requiredMaxScroll + window.innerHeight;

      const contentBottomDocY = window.scrollY + sectionsRoot.getBoundingClientRect().bottom;
      const finaleMarginTop = parseFloat(window.getComputedStyle(spineFinale).marginTop) || 52;
      const svgRenderedHeight = finaleSvg ? finaleSvg.getBoundingClientRect().height + 24 : 220;
      const neededFinaleHeight = Math.max(
        Math.ceil(svgRenderedHeight),
        Math.ceil(requiredDocHeight - contentBottomDocY - finaleMarginTop)
      );

      spineFinale.style.minHeight = `${neededFinaleHeight}px`;

      if (spineTrack) {
        spineTrack.style.bottom = '0px';
      }
    }

    // 6. Collapse State & Navigation (A2, C5, D2)
    function setSectionCollapsed(record, isCollapsed) {

        navPinTimer = null;
      }
    }

    sectionRecords.forEach(record => {
      if (!record.header) return;

      const toggleSection = () => {
        const nextCollapsed = !record.el.classList.contains('is-collapsed');
        setSectionCollapsed(record, nextCollapsed);
        if (nextCollapsed) {
          collapsedSectionIds.add(record.id);
        } else {
          collapsedSectionIds.delete(record.id);
        }
        saveStoredSet('toxico_collapsed', collapsedSectionIds);
        updateBottomRunway();
        scheduleScrollUpdate();
      };

        navTargetScrollY = 0;

        scheduleScrollUpdate();

      link.addEventListener('click', (e) => {
        e.preventDefault();

        const targetRecord = sectionRecords.find(r => r.id === targetId);

        if (targetRecord.el.style.display === 'none' && (searchInput.value || onlyFavorites)) {

          saveStoredSet('toxico_collapsed', collapsedSectionIds);
        }

        updateBottomRunway();

        const targetOffset = getTopBarOffset();
        const headerEl = targetRecord.header || targetRecord.el;
        const headerRect = headerEl.getBoundingClientRect();
        const targetScrollY = Math.max(0, Math.round(window.scrollY + headerRect.top - targetOffset));

        navPinnedSectionId = targetRecord.id;
        navTargetScrollY = targetScrollY;
        if (navPinTimer) clearTimeout(navPinTimer);
        navPinTimer = setTimeout(() => {
          clearNavPin();
          scheduleScrollUpdate();
        }, 1500);

    function markCardVisited(card) {

        const label = isFav ? 'Remove from favorites' : 'Add to favorites';
        favBtn.setAttribute('aria-label', label);
        favBtn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
        favBtn.title = label;
        if (onlyFavorites) applyFilters();
        return;
      }

      const cardLink = e.target.closest('.card-link');
      if (cardLink) {
        markCardVisited(cardLink.closest('.link-card'));
      }
    });

    sectionsRoot.addEventListener('auxclick', (e) => {
      if (e.button !== 1 || e.target.closest('.fav-btn')) return;
      const cardLink = e.target.closest('.card-link');
      if (cardLink) {
        markCardVisited(cardLink.closest('.link-card'));
      }
    });

    // Inline Two-Step Reset History (No blocking window.confirm)
    let resetConfirmTimer = null;
    const DEFAULT_RESET_LABEL = 'Reset visited links history';
    const CONFIRM_RESET_LABEL = 'Press again to confirm reset';

    resetHistoryBtn.addEventListener('click', () => {
      if (!resetHistoryBtn.classList.contains('is-confirming')) {
        resetHistoryBtn.classList.add('is-confirming');
        resetHistoryBtn.setAttribute('aria-label', CONFIRM_RESET_LABEL);
        resetHistoryBtn.title = CONFIRM_RESET_LABEL;
        if (resetHistoryLabel) resetHistoryLabel.style.display = 'inline';
        if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
        resetConfirmTimer = setTimeout(() => {
          resetHistoryBtn.classList.remove('is-confirming');
          resetHistoryBtn.setAttribute('aria-label', DEFAULT_RESET_LABEL);
          resetHistoryBtn.title = DEFAULT_RESET_LABEL;
          if (resetHistoryLabel) resetHistoryLabel.style.display = 'none';
        }, 3000);
        return;
      }

      if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
      resetHistoryBtn.classList.remove('is-confirming');
      resetHistoryBtn.setAttribute('aria-label', DEFAULT_RESET_LABEL);
      resetHistoryBtn.title = DEFAULT_RESET_LABEL;
      if (resetHistoryLabel) resetHistoryLabel.style.display = 'none';

      try {
        localStorage.removeItem('toxico_visited');
      } catch (_) {}
      visitedHrefs.clear();
      linkCards.forEach(card => {
        card.classList.remove('visited');
        const tag = card.querySelector('.tag-visited');
        if (tag) tag.remove();
      });
    });

    // 8. Unified Filtering & Search (D1)
    function normalizeSearchText(str) {
      return (str || '')
        .normalize('NFC')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function applyFilters() {
      const rawQuery = searchInput.value;
      const normalizedQuery = normalizeSearchText(rawQuery);
      const queryTokens = normalizedQuery ? normalizedQuery.split(' ').filter(Boolean) : [];
      const isFiltering = Boolean(queryTokens.length > 0 || onlyFavorites);
      let anySectionVisible = false;

      sectionRecords.forEach(record => {
        setSectionCollapsed(record, isFiltering ? false : collapsedSectionIds.has(record.id));
        let visibleCardsCount = 0;
        const sectionTitleText = normalizeSearchText(record.title ? record.title.textContent : '');

        record.groups.forEach(({ grid, heading, cards }) => {
          const groupTitleText = normalizeSearchText(heading ? heading.textContent : '');
          let hasVisibleCard = false;

          cards.forEach(card => {
            const favMatch = !onlyFavorites || favoriteHrefs.has(card.dataset.key);
            let textMatch = true;

            if (queryTokens.length > 0) {
              const cardTitleText = normalizeSearchText(card.dataset.search || '');
              const searchableCombined = `${cardTitleText} ${groupTitleText} ${sectionTitleText}`;
              textMatch = queryTokens.every(token => searchableCombined.includes(token));
            }

            const match = favMatch && textMatch;
            card.style.display = match ? '' : 'none';
            if (match) {
              hasVisibleCard = true;
              visibleCardsCount++;
            }
          });

          if (heading) heading.style.display = hasVisibleCard ? '' : 'none';
          grid.style.display = hasVisibleCard ? '' : 'none';
        });

        const hasVisibleGrid = visibleCardsCount > 0;
        record.el.style.display = hasVisibleGrid ? '' : 'none';

        if (record.meta && record.meta.dataset.unit) {
          const total = record.allCards.length;
          record.meta.textContent = isFiltering
            ? `${visibleCardsCount} / ${total} ${record.meta.dataset.unit}`
            : `${total} ${record.meta.dataset.unit}`;
        }

        if (hasVisibleGrid) anySectionVisible = true;
      });

      if (!anySectionVisible) {
        if (onlyFavorites && !queryTokens.length) {
          emptyStateText.textContent = 'No favorite resources yet. Click the star icon on any card to bookmark it.';
          clearSearchBtn.textContent = 'Show all resources';
        } else {
          emptyStateText.textContent = 'No resources match your current filter.';
          clearSearchBtn.textContent = 'Clear filter';
        }
      }
      emptyState.style.display = anySectionVisible ? 'none' : 'block';
      updateBottomRunway();
      scheduleScrollUpdate();
    }

    favoritesFilterBtn.addEventListener('click', () => {
      onlyFavorites = !onlyFavorites;
      favoritesFilterBtn.classList.toggle('is-active', onlyFavorites);
      favoritesFilterBtn.setAttribute('aria-pressed', onlyFavorites ? 'true' : 'false');
      applyFilters();
    });

    searchInput.addEventListener('input', applyFilters);

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      if (onlyFavorites) {
        onlyFavorites = false;
        favoritesFilterBtn.classList.remove('is-active');
        favoritesFilterBtn.setAttribute('aria-pressed', 'false');
      }
      applyFilters();
      searchInput.focus();
    });

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      const isEditable = tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);
      if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !isEditable) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        applyFilters();
        searchInput.blur();
      }
    });

    // 9. Structured Scroll Progress & Pipeline (C2: Read Phase then Write Phase)
    let rafPending = false;

    function updateScrollProgress() {
      rafPending = false;
      if (!spineTrack || !spineFill) return;

      // ==========================================
      // READ PHASE (Batch all DOM queries & measurements)
      // ==========================================
      const scrollY = window.scrollY;
      const innerHeight = window.innerHeight;
      const scrollHeight = document.documentElement.scrollHeight;

      if (navPinnedSectionId && navTargetScrollY !== null) {
        if (Math.abs(scrollY - navTargetScrollY) <= 2) {
          clearNavPin();
        }
      }

      const targetOffset = getTopBarOffset();
      const headerThresholdY = targetOffset + 4;
      const trackRect = spineTrack.getBoundingClientRect();
      const trackHeight = Math.max(1, spineTrack.offsetHeight);
      const visibleRecords = sectionRecords.filter(r => r.el.style.display !== 'none');

      let thresholdRecord = visibleRecords.length > 0 ? visibleRecords[0] : null;
      const recordMetrics = visibleRecords.map(record => {
        const headerEl = record.header || record.el;
        const hRect = headerEl.getBoundingClientRect();
        if (hRect.top <= headerThresholdY) {
          thresholdRecord = record;
        }
        const kRect = record.kicker ? record.kicker.getBoundingClientRect() : null;
        const tRect = record.title ? record.title.getBoundingClientRect() : null;
        return { record, hRect, kRect, tRect };
      });

      const activeRecord = (navPinnedSectionId && visibleRecords.find(r => r.id === navPinnedSectionId)) || thresholdRecord;
      const activeSectionId = activeRecord ? activeRecord.id : '';

      const activeMetric = recordMetrics.find(m => m.record === activeRecord) || recordMetrics[0];
      const refHeaderHeight = activeMetric && activeMetric.hRect ? activeMetric.hRect.height : 68;
      const anchorViewportY = targetOffset + refHeaderHeight;

      const firstHeaderBottom = recordMetrics.length > 0 && recordMetrics[0].hRect
        ? recordMetrics[0].hRect.bottom
        : anchorViewportY;

      let lineTipViewportY = Math.max(anchorViewportY, firstHeaderBottom);

      const maxScroll = Math.max(0, scrollHeight - innerHeight);
      if (!navPinnedSectionId && maxScroll > tailStartScrollY && scrollY > tailStartScrollY) {
        const tailRatio = Math.min(1, Math.max(0, (scrollY - tailStartScrollY) / Math.max(1, maxScroll - tailStartScrollY)));
        lineTipViewportY = lineTipViewportY + tailRatio * Math.max(0, innerHeight - lineTipViewportY);
      }

      if (navPinnedSectionId && activeMetric && activeMetric.hRect) {
        lineTipViewportY = Math.max(lineTipViewportY, activeMetric.hRect.bottom);
      }

      const finaleSvgVisible = Boolean(spineFinale && finaleSvg && spineFinale.style.display !== 'none');
      const finaleSvgRect = finaleSvgVisible ? finaleSvg.getBoundingClientRect() : null;

      const headingMetrics = allHeadings
        .filter(h3 => h3.style.display !== 'none' && h3.offsetParent !== null)
        .map(h3 => ({ h3, rect: h3.getBoundingClientRect() }));

      // ==========================================
      // COMPUTATION
      // ==========================================
      const lineTipY = Math.min(trackHeight, Math.max(0, lineTipViewportY - trackRect.top));

      let tipSvgY = 0;
      let dashOffset = 1000;
      if (finaleSvgRect) {
        const svgHeight = Math.max(1, finaleSvgRect.height);
        tipSvgY = ((lineTipViewportY - finaleSvgRect.top) / svgHeight) * SVG_VIEWBOX_HEIGHT;
        const branchProgress = Math.min(1, Math.max(0, (tipSvgY - 150) / 46));
        dashOffset = Math.round((1 - branchProgress) * 1000);
      }

      // ==========================================
      // WRITE PHASE (Batch all DOM mutations with zero intervening reads)
      // ==========================================
      spineFill.style.height = `${lineTipY}px`;

      if (finaleSvgVisible) {
        spineFinale.classList.toggle('is-node-reached', tipSvgY >= 44);
        spineFinale.classList.toggle('is-cat-reached',  tipSvgY >= 150);
        spineFinale.classList.toggle('is-end-reached',  tipSvgY >= 196);

        if (finaleBranchRight) finaleBranchRight.style.strokeDashoffset = `${dashOffset}`;
      }

      recordMetrics.forEach(({ record, hRect, kRect, tRect }) => {
        if (record.kicker && kRect) {
          record.kicker.classList.toggle('is-reached', lineTipViewportY >= kRect.top + kRect.height * 0.55);
        }

        const titleReached = tRect ? (lineTipViewportY >= tRect.top + tRect.height * 0.55) : false;
        record.el.classList.toggle('is-reached', titleReached);
        record.el.classList.toggle('is-border-reached', lineTipViewportY >= hRect.bottom - 1);
        record.el.classList.toggle('is-active', record.id === activeSectionId);
      });

      // Clear states on non-visible sections
      sectionRecords.forEach(record => {
        if (record.el.style.display === 'none') {
          record.el.classList.remove('is-reached', 'is-active', 'is-border-reached');
          if (record.kicker) record.kicker.classList.remove('is-reached');
        }
      });

      navLinks.forEach(link => {
        link.classList.toggle('is-active', link.getAttribute('data-target') === activeSectionId);
      });

      headingMetrics.forEach(({ h3, rect }) => {
        h3.classList.toggle('is-reached', lineTipViewportY >= rect.top + rect.height * 0.55);
      });
    }

    function scheduleScrollUpdate() {
      if (!rafPending) {
        rafPending = true;
        window.requestAnimationFrame(updateScrollProgress);
      }
    }

    window.addEventListener('scroll', scheduleScrollUpdate, { passive: true });
    window.addEventListener('resize', () => {
      updateBottomRunway();
      scheduleScrollUpdate();
    }, { passive: true });

    // 10. Performance Observers (C3, C4)
    // IntersectionObserver to pause cat panorama when offscreen (C3)
    if ('IntersectionObserver' in window && spineFinale) {
      const finaleObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          spineFinale.classList.toggle('is-paused', !entry.isIntersecting);
        });
      }, { rootMargin: '100px' });
      finaleObserver.observe(spineFinale);
    }

    // ResizeObserver on sections root + font readiness (C4)
    if ('ResizeObserver' in window && sectionsRoot) {
      const sectionsObserver = new ResizeObserver(() => {
        updateBottomRunway();
        scheduleScrollUpdate();
      });
      sectionsObserver.observe(sectionsRoot);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        updateBottomRunway();
        scheduleScrollUpdate();
      });
    }

    // 11. Initial View & Deep Link Resolution (D2)
    applyFilters();

    if (location.hash) {
      const hashId = location.hash.replace(/^#/, '');
      const targetRecord = sectionRecords.find(r => r.id === hashId);
      if (targetRecord) {
        if (targetRecord.el.classList.contains('is-collapsed')) {
          setSectionCollapsed(targetRecord, false);
          collapsedSectionIds.delete(targetRecord.id);
          saveStoredSet('toxico_collapsed', collapsedSectionIds);
        }
        updateBottomRunway();
        requestAnimationFrame(() => {
          const targetOffset = getTopBarOffset();
          const headerEl = targetRecord.header || targetRecord.el;
          const targetScrollY = Math.max(0, Math.round(window.scrollY + headerEl.getBoundingClientRect().top - targetOffset));
          window.scrollTo({ top: targetScrollY, behavior: 'instant' });
          scheduleScrollUpdate();
        });
      }
    }
  </script>
</body>
</html>
