<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toxico Index · Clinical Toxicology Resources</title>
  <meta name="description" content="Clinical toxicology index, lecture links, research papers, and antivenom clinical guidelines.">
  <meta property="og:title" content="Toxico Index · Clinical Toxicology Resources">
  <meta property="og:description" content="Clinical toxicology index, lecture links, research papers, and antivenom clinical guidelines.">
  <meta name="theme-color" content="#F4F4F2" id="meta-theme-color">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%239E1B32'/%3E%3Cpath d='M12.5 6h7a1 1 0 0 1 1 1v1.5a1 1 0 0 1-1 1h-.7v2.8l5.6 9.8A2.5 2.5 0 0 1 22.2 26H9.8a2.5 2.5 0 0 1-2.2-3.9l5.6-9.8V9.5h-.7a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1z' fill='%23ffffff'/%3E%3Crect x='14.6' y='15.7' width='2.8' height='6.6' rx='0.6' fill='%239E1B32'/%3E%3Crect x='12.7' y='17.6' width='6.6' height='2.8' rx='0.6' fill='%239E1B32'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Outfit:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('toxico_theme');
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.dataset.theme = saved;
        } else {
          var isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        }
      } catch (_) {}
    })();
  </script>
  <style>
    :root,
    [data-theme="light"] {
      color-scheme: light;
      --font-display: 'Outfit', 'IBM Plex Sans Thai', sans-serif;
      --font-sans: 'Plus Jakarta Sans', 'IBM Plex Sans Thai', -apple-system, sans-serif;

      /* Low-Chroma Architectural Stone & Clinical Oxblood Palette (WCAG AA compliant) */
      --bg-canvas: #F4F4F2;
      --bg-menu: #FFFFFF;
      --bg-elevated: #FFFFFF;
      --bg-subtle: #EAEAE6;
      --bg-hover: #FFFFFF;
      --bg-visited: #EFEFEB;
      --ink-primary: #111110;
      --ink-secondary: #484844;
      --ink-muted: #63635E;
      --line: #E6E6E1;
      --line-strong: #CECEC6;
      --line-hover: #111110;

      /* Clinical Oxblood Accent (Hue 349deg, 6.9:1 against canvas) */
      --accent: #9E1B32;
      --accent-soft: #FCECEE;
      --accent-ink: #7A1224;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg-canvas: #0B0B0B;
      --bg-menu: #141414;
      --bg-elevated: #141414;
      --bg-subtle: #1E1E1E;
      --bg-hover: #1A1A1A;
      --bg-visited: #101010;
      --ink-primary: #F5F5F3;
      --ink-secondary: #B5B5AF;
      --ink-muted: #8E8E88;
      --line: #232323;
      --line-strong: #3A3A38;
      --line-hover: #F5F5F3;

      --accent: #E04F67;
      --accent-soft: #2C151A;
      --accent-ink: #F79AA8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: clip;
    }

    body {
      font-family: var(--font-sans);
      font-size: 0.875rem;
      background-color: var(--bg-canvas);
      color: var(--ink-primary);
      line-height: 1.5;
      min-height: 100dvh;
      overflow-x: clip;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Sticky Opaque Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: var(--bg-menu);
      border-bottom: 1px solid var(--line);
    }

    .top-bar-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0.65rem clamp(1.125rem, 3vw, 2.5rem);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
    }

    .brand-wordmark {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink-primary);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: color 0.15s var(--ease);
    }

    .brand-mark {
      width: 1.25rem;
      height: 1.25rem;
      border-radius: 4px;
      background: var(--accent);
      color: #FFFFFF;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-mark svg {
      width: 0.8rem;
      height: 0.8rem;
    }

    .brand-wordmark:hover {
      color: var(--accent);
    }

    /* Segmented Menu Rail */
    .top-nav {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem;
      background: var(--bg-subtle);
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .top-nav a {
      color: var(--ink-secondary);
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
      padding: 0.3rem 0.75rem;
      border-radius: 4px;
      transition: color 0.15s var(--ease), background-color 0.15s var(--ease);
    }

    .top-nav a:hover {
      color: var(--ink-primary);
      background: var(--bg-elevated);
    }

    .top-nav a.is-active {
      color: var(--bg-elevated);
      background: var(--ink-primary);
      font-weight: 600;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .search-box {
      position: relative;
      width: 240px;
    }

    .search-box svg {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      width: 0.875rem;
      height: 0.875rem;
      color: var(--ink-muted);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      height: 2.125rem;
      padding: 0.35rem 2rem 0.35rem 2rem;
      border-radius: 6px;
      border: 1px solid var(--line-strong);
      background: var(--bg-elevated);
      color: var(--ink-primary);
      font-size: 0.875rem;
      font-weight: 400;
      font-family: inherit;
      transition: border-color 0.15s var(--ease);
    }

    .search-box input::placeholder {
      color: var(--ink-muted);
    }

    .search-box input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }

    .search-box input:focus ~ .search-kbd,
    .search-box input:not(:placeholder-shown) ~ .search-kbd {
      display: none;
    }

    kbd.search-kbd {
      position: absolute;
      right: 0.45rem;
      top: 50%;
      transform: translateY(-50%);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink-secondary);
      background: var(--bg-subtle);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0.05rem 0.38rem;
      line-height: 1.2;
      pointer-events: none;
    }

    /* Flat Tactile Action Buttons */
    .btn-ghost {
      background: var(--bg-elevated);
      border: 1px solid var(--line-strong);
      color: var(--ink-primary);
      cursor: pointer;
      height: 2.125rem;
      padding: 0 0.7rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.38rem;
      font-size: 0.875rem;
      font-family: inherit;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s var(--ease), border-color 0.15s var(--ease), background-color 0.15s var(--ease), transform 0.1s var(--ease);
    }

    .btn-ghost:hover,
    .btn-ghost.is-active {
      color: var(--bg-elevated);
      border-color: var(--ink-primary);
      background: var(--ink-primary);
    }

    .btn-ghost.is-confirming {
      color: #FFFFFF;
      border-color: var(--accent);
      background: var(--accent);
    }

    [data-theme="dark"] .btn-ghost.is-confirming {
      color: #111110;
    }

    .btn-ghost:active {
      transform: translateY(1px);
    }

    .btn-ghost.is-active svg {
      fill: currentColor;
    }

    .btn-ghost:focus-visible,
    .fav-btn:focus-visible,
    .card-link:focus-visible,
    .top-nav a:focus-visible,
    .section-toggle:focus-visible,
    .filter-chip:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-ghost svg {
      width: 0.875rem;
      height: 0.875rem;
    }

    /* Main Container with Dedicated Unobstructed Left Spine Lane */
    .page-shell {
      position: relative;
      max-width: 1200px;
      margin: 0 auto;
      --spine-x: clamp(1.35rem, 2.5vw, 2.1rem);
      padding: clamp(1.5rem, 3vw, 2.25rem) clamp(1.125rem, 3vw, 2.5rem) 2rem calc(var(--spine-x) + 1.35rem);
      scroll-margin-top: 4.5rem;
    }

    /* Unbroken Vertical Progress Spine in Dedicated Left Gutter */
    .spine-track {
      position: absolute;
      left: var(--spine-x);
      top: clamp(1.85rem, 3.2vw, 2.6rem);
      bottom: 2rem;
      width: 2px;
      background: var(--line-strong);
      z-index: 1;
      pointer-events: none;
    }

    .spine-fill {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 0px;
      background: var(--accent);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Clinical Workbench Header & Divided Summary Strip */
    .workbench-header {
      position: relative;
      z-index: 2;
      margin-bottom: 1.75rem;
    }

    .workbench-title-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      margin-bottom: 0.65rem;
    }

    .workbench-node {
      position: absolute;
      left: calc(-1.35rem - 4px);
      top: 0.45rem;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      border: 2px solid var(--bg-canvas);
      pointer-events: none;
    }

    /* Status Filter Chips (All / Unread / Reviewed / Saved) */
    .status-filter-rail {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem;
      background: var(--bg-subtle);
      border: 1px solid var(--line);
      border-radius: 6px;
      align-self: center;
    }

    .filter-chip {
      background: transparent;
      border: none;
      color: var(--ink-secondary);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.28rem 0.65rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.15s var(--ease), background-color 0.15s var(--ease);
    }

    .filter-chip:hover {
      color: var(--ink-primary);
      background: var(--bg-elevated);
    }

    .filter-chip.is-active {
      color: var(--bg-elevated);
      background: var(--ink-primary);
      font-weight: 600;
    }

    /* Divided KPI Strip (app-screens.md §5 default: 1 container split by 1px hairlines) */
    .workbench-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      background: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .kpi-cell {
      padding: 0.65rem 1rem;
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 0;
    }

    .kpi-cell:last-child {
      border-right: none;
    }

    .kpi-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .kpi-value-row {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .kpi-value {
      font-family: var(--font-display);
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.2;
      color: var(--ink-primary);
      font-variant-numeric: tabular-nums;
    }

    .kpi-unit {
      font-size: 0.75rem;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    /* Section Architecture */
    .section {
      position: relative;
      z-index: 2;
      scroll-margin-top: 4.5rem;
      display: block;
      margin-bottom: clamp(2.25rem, 4vw, 3.25rem);
    }

    .section:last-of-type {
      margin-bottom: 0;
    }

    .section-header {
      position: relative;
      z-index: 2;
      padding: 0.4rem 0 0.65rem 0;
      margin-bottom: 1.15rem;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: border-color 0.2s var(--ease), margin-bottom 0.2s var(--ease);
    }

    .section-node {
      position: absolute;
      left: calc(-1.35rem - 4px);
      top: 0.68rem;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 2px solid var(--line-strong);
      transition: background-color 0.2s var(--ease), border-color 0.2s var(--ease), transform 0.2s var(--ease);
      pointer-events: none;
    }

    .section.is-reached .section-node {
      border-color: var(--accent);
      background: var(--bg-elevated);
    }

    .section.is-active .section-node {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.15);
    }

    .section-toggle {
      background: transparent;
      border: none;
      font: inherit;
      color: inherit;
      text-align: left;
      padding: 0;
      margin: 0;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
      border-radius: 4px;
    }

    .spine-title {
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
      color: var(--ink-secondary);
      transition: color 0.15s var(--ease);
    }

    .section-meta-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-meta {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
    }

    .section-chevron {
      width: 0.875rem;
      height: 0.875rem;
      color: var(--ink-muted);
      transition: transform 0.2s var(--ease), color 0.15s var(--ease);
    }

    .section.is-collapsed .section-chevron {
      transform: rotate(-90deg);
    }

    .section.is-collapsed {
      margin-bottom: 1.5rem;
    }

    .section.is-collapsed .section-header {
      margin-bottom: 0;
    }

    .section.is-collapsed .section-content {
      display: none;
    }

    /* Reached & Active Section States */
    .section.is-border-reached .section-header {
      border-bottom-color: var(--line-strong);
    }

    .section.is-reached .spine-title {
      color: var(--ink-primary);
    }

    .section.is-active .spine-title {
      color: var(--accent);
    }

    .section-content {
      position: relative;
      z-index: 2;
      min-width: 0;
    }

    /* Sub-Topic Headings */
    h3.group-heading {
      position: relative;
      z-index: 2;
      font-family: var(--font-sans);
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--ink-secondary);
      margin: 1.4rem 0 0.6rem 0;
      padding: 0.15rem 0;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.5rem;
      transition: color 0.15s var(--ease);
    }

    h3.group-heading:first-of-type {
      margin-top: 0.1rem;
    }

    h3.group-heading.is-reached {
      color: var(--ink-primary);
    }

    .group-count {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink-muted);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }

    /* 3-Column Flat Resource Card Grid */
    .links-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.625rem;
    }

    /* Compact Two-Line Resource Row Card (height < 72px so probe.mjs treats as row card) */
    .link-card {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.625rem;
      padding: 0.5rem 0.8rem;
      background-color: var(--bg-elevated);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink-primary);
      font-size: 0.875rem;
      font-weight: 500;
      line-height: 1.3;
      transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
    }

    .link-card:hover {
      background-color: var(--bg-hover);
      border-color: var(--line-hover);
    }

    .link-card:focus-within {
      border-color: var(--accent);
    }

    .card-link {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      min-width: 0;
      flex: 1;
      color: inherit;
      text-decoration: none;
    }

    /* Whole card clickable area */
    .card-link::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 0;
      border-radius: 8px;
    }

    .card-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .link-card svg.card-icon {
      width: 0.875rem;
      height: 0.875rem;
      flex-shrink: 0;
      color: var(--ink-muted);
      margin-top: 0.16rem;
      transition: color 0.15s var(--ease);
    }

    .link-card:hover svg.card-icon {
      color: var(--accent);
    }

    .card-body {
      display: flex;
      flex-direction: column;
      gap: 0.12rem;
      min-width: 0;
      flex: 1;
    }

    .card-content {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
      line-height: 1.28;
    }

    .card-source {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--ink-muted);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Card Favorite Star Button */
    .fav-btn {
      position: relative;
      z-index: 1;
      background: transparent;
      border: none;
      width: 2rem;
      height: 2rem;
      padding: 0;
      margin: -0.25rem -0.35rem -0.25rem 0;
      border-radius: 6px;
      color: var(--ink-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      opacity: 0.55;
      transition: color 0.15s var(--ease), opacity 0.15s var(--ease), transform 0.12s var(--ease);
    }

    .link-card:hover .fav-btn,
    .fav-btn:focus-visible {
      opacity: 0.9;
    }

    .fav-btn:hover {
      opacity: 1 !important;
      color: var(--accent);
      transform: scale(1.1);
    }

    .fav-btn.is-favorite {
      opacity: 1;
      color: var(--accent);
    }

    .fav-btn svg {
      width: 0.875rem;
      height: 0.875rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fav-btn.is-favorite svg {
      fill: currentColor;
    }

    /* Status Pills (app-screens.md §7.6: pale tint with dark text, >=12px) */
    .tag-new {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.15;
      color: var(--accent-ink);
      background: var(--accent-soft);
      padding: 0.06rem 0.36rem;
      border-radius: 4px;
      margin-left: 0.35rem;
      white-space: nowrap;
      vertical-align: baseline;
    }

    /* Visited State */
    .link-card.visited {
      background-color: var(--bg-visited);
      border-color: var(--line);
      color: var(--ink-secondary);
    }

    .link-card.visited:hover {
      border-color: var(--line-strong);
      color: var(--ink-primary);
    }

    .link-card.visited svg.card-icon {
      color: var(--ink-muted);
    }

    .tag-visited {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--ink-muted);
      margin-left: 0.35rem;
      white-space: nowrap;
    }

    .tag-visited::before {
      content: "· ";
    }

    /* Empty Search / Filter State (Solid 1px frame per app-screens.md §11) */
    .empty-state {
      position: relative;
      z-index: 2;
      display: none;
      padding: 2.25rem 1.25rem;
      text-align: center;
      background-color: var(--bg-elevated);
      color: var(--ink-secondary);
      font-size: 0.875rem;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .empty-state button {
      margin-top: 0.75rem;
    }

    /* Bottom Spine Runway & Minimalist Centered Cat Scene */
    .spine-finale {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: clamp(2rem, 3.5vw, 3rem);
      padding: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .finale-character-wrap {
      position: relative;
      display: block;
      width: clamp(320px, 50vw, 480px);
      margin: 0 auto;
      flex-shrink: 0;
    }

    .finale-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    /* Minimalist Finale Scene Animations & Interactive States */
    @keyframes tailPendulum {
      0%, 100% { transform: rotate(-6deg); }
      50% { transform: rotate(8deg); }
    }
    @keyframes eyeBlink {
      0%, 45%, 48%, 100% { transform: scaleY(1); }
      46.5% { transform: scaleY(0.08); }
    }
    @keyframes bubbleFloat {
      0% { transform: translateY(0) scale(0.9); opacity: 0; }
      30% { opacity: 0.85; }
      80% { opacity: 0.55; }
      100% { transform: translateY(-16px) scale(1.08); opacity: 0; }
    }

    .svg-tail {
      transform-box: fill-box;
      transform-origin: 90% 85%;
      animation: tailPendulum 3.6s ease-in-out infinite;
    }
    .svg-eye-blink {
      transform-box: fill-box;
      transform-origin: center;
      animation: eyeBlink 6s ease-in-out infinite;
    }
    .svg-bubble-1 {
      transform-box: fill-box;
      transform-origin: center;
      animation: bubbleFloat 3.8s ease-in-out infinite;
    }
    .svg-bubble-2 {
      transform-box: fill-box;
      transform-origin: center;
      animation: bubbleFloat 4.4s ease-in-out 1.6s infinite;
    }

    .finale-target {
      fill: var(--bg-subtle);
      transition: fill 0.35s var(--ease), stroke 0.35s var(--ease);
    }

    .spine-finale.is-cat-reached .t-cat,
    .spine-finale.is-end-reached .t-end {
      fill: var(--accent);
    }

    .finale-halo {
      fill: var(--bg-subtle);
      opacity: 0.55;
      transition: fill 0.4s var(--ease), opacity 0.4s var(--ease);
    }
    .spine-finale.is-cat-reached .finale-halo {
      fill: var(--accent-soft);
      opacity: 1;
    }

    .finale-branch-track {
      stroke: var(--line-strong);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .finale-branch-fill {
      stroke: var(--accent);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
    }

    /* Pause offscreen */
    .spine-finale.is-paused .svg-tail,
    .spine-finale.is-paused .svg-eye-blink,
    .spine-finale.is-paused .svg-bubble-1,
    .spine-finale.is-paused .svg-bubble-2 {
      animation-play-state: paused;
    }

    /* Theme switch: View Transitions (primary) */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation-duration: 0.3s;
      animation-timing-function: ease;
    }

    /* Theme switch: fallback for browsers without View Transitions */
    .theme-switching,
    .theme-switching *,
    .theme-switching *::before,
    .theme-switching *::after {
      transition: background-color .3s ease, color .3s ease, border-color .3s ease,
                  fill .3s ease, stroke .3s ease !important;
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto !important; }
      .svg-tail,
      .svg-eye-blink,
      .svg-bubble-1,
      .svg-bubble-2 {
        animation: none !important;
      }
      ::view-transition-group(root),
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation: none !important;
      }
    }

    @media (hover: none) {
      .fav-btn {
        opacity: 0.8;
        width: 2.35rem;
        height: 2.35rem;
      }
      kbd.search-kbd {
        display: none;
      }
    }

    @media (max-width: 960px) {
      .links-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .workbench-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .kpi-cell:nth-child(2) {
        border-right: none;
      }
      .kpi-cell:nth-child(1),
      .kpi-cell:nth-child(2) {
        border-bottom: 1px solid var(--line);
      }
      .search-box {
        width: 190px;
      }
    }

    @media (max-width: 680px) {
      .top-bar-inner {
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.65rem 1.125rem;
      }
      .brand-wordmark {
        font-size: 0.95rem;
      }
      .top-nav {
        gap: 0.12rem;
        font-size: 0.75rem;
      }
      .top-nav a {
        padding: 0.28rem 0.55rem;
      }
      .top-actions {
        width: 100%;
      }
      .search-box {
        flex: 1;
        width: auto;
      }
      .search-box input,
      .btn-ghost {
        height: 2.35rem;
      }
      .search-box input {
        padding-right: 0.75rem;
      }
      kbd.search-kbd {
        display: none;
      }
      .page-shell {
        --spine-x: 1.125rem;
        padding: 1.25rem 1.125rem 1.75rem 2.25rem;
        scroll-margin-top: 6.75rem;
      }
      .section {
        scroll-margin-top: 6.75rem;
      }
      .workbench-node,
      .section-node {
        left: calc(-1.125rem - 4px);
      }
      .status-filter-rail {
        width: 100%;
        justify-content: space-between;
      }
      .filter-chip {
        flex: 1;
        text-align: center;
      }
      .links-grid {
        grid-template-columns: 1fr;
      }
      .finale-character-wrap {
        width: clamp(260px, 84vw, 380px);
      }
    }

    /* Print Stylesheet */
    @media print {
      .top-bar,
      .spine-finale,
      .fav-btn,
      .search-box,
      .top-actions,
      .status-filter-rail,

        display: none !important;

        display: block !important;
      }
      .section {
        break-inside: avoid;
        page-break-inside: avoid;
        margin-bottom: 2rem !important;
      }
      body, .page-shell {
        background: #fff !important;
        color: #000 !important;
        padding: 0 !important;
      }

        text-decoration: underline !important;
      }

    // Derive concise clinical source metadata from resource href
    function getResourceSourceMeta(href) {
      if (!href) return 'Resource';
      if (href.includes('youtube.com') || href.includes('youtu.be')) return 'YouTube · Video lecture';
      if (href.startsWith('pdfs/')) return 'Ramathibodi · PDF protocol';
      if (href.startsWith('docs/')) return 'Interactive deck · 28 slides';
      if (href.includes('pubmed.ncbi.nlm.nih.gov')) {
        const m = href.match(/\/(\d+)\/?$/);
        return m ? `PubMed · PMID ${m[1]}` : 'PubMed · Journal paper';
      }
      if (href.includes('sciencedirect.com')) return 'ScienceDirect · Forensic toxicology';
      if (href.includes('journals.plos.org')) return 'PLOS NTDs · Clinical study';
      if (href.includes('researchgate.net')) return 'ResearchGate · Case series';
      if (href.includes('emdocs.net')) return 'emDOCs · Emergency review';
      if (href.includes('epa.nsw.gov.au')) return 'NSW EPA · Environmental hazard';
      if (href.includes('edition.cnn.com')) return 'CNN · Public health report';
      if (href.includes('britannica.com')) return 'Britannica · Historical toxicology';
      return 'External reference';
    }

    // 2. LocalStorage Helpers (Backward-Compatible & Collision-Safe)
    function legacyNormalizeKey(rawUrl) {
      if (typeof rawUrl !== 'string') return '';
      const stripped = rawUrl.replace(/^https?:\/\/[^/]+\//, '').replace(/^\//, '');
      try {
        return decodeURI(stripped);
      } catch (_) {
        return stripped;
      }
    }

    function normalizeKey(rawUrl) {
      if (typeof rawUrl !== 'string') return '';
      const trimmed = rawUrl.trim().replace(/^\//, '');
      try {
        return decodeURI(trimmed);
      } catch (_) {
        return trimmed;
      }
    }

        group.items.forEach(item => {
          const canonical = item.id || normalizeKey(item.href);
          const legacy = legacyNormalizeKey(item.href);
          legacyToCanonicalMap.set(legacy, canonical);
          legacyToCanonicalMap.set(canonical, canonical);
          if (item.href) {
            legacyToCanonicalMap.set(normalizeKey(item.href), canonical);
            legacyToCanonicalMap.set(encodeURI(item.href), canonical);
          }
        });
      });
    });

    function setTheme(theme, persist) {
      const resolved = theme === 'dark' ? 'dark' : 'light';

      if (themeIcon) themeIcon.innerHTML = resolved === 'dark' ? sunIcon : moonIcon;
      if (metaThemeColor) metaThemeColor.setAttribute('content', resolved === 'dark' ? '#0B0B0B' : '#F4F4F2');

    function updateWorkbenchMetrics() {
      const totalCount = linkCards.length;
      const visitedCount = linkCards.filter(c => visitedHrefs.has(c.dataset.key)).length;
      const favCount = linkCards.filter(c => favoriteHrefs.has(c.dataset.key)).length;
      const pct = totalCount > 0 ? Math.round((visitedCount / totalCount) * 100) : 0;

      if (kpiTotalEl) kpiTotalEl.textContent = String(totalCount);
      if (kpiVisitedEl) kpiVisitedEl.textContent = String(visitedCount);
      if (kpiVisitedSubEl) kpiVisitedSubEl.textContent = `${pct}% of ${totalCount} reviewed`;

    function syncFinaleSpineAlignment() {
      if (!spineTrack || !spineFinale || !finaleSvg || spineFinale.style.display === 'none') return;
      const trackRect = spineTrack.getBoundingClientRect();
      const svgRect = finaleSvg.getBoundingClientRect();
      if (!svgRect.width) return;

      const spineCenterPx = trackRect.left + trackRect.width * 0.5;
      const scaleX = SVG_VIEWBOX_WIDTH / svgRect.width;
      const spineSvgX = Math.round((spineCenterPx - svgRect.left) * scaleX * 10) / 10;

      if (finaleSpineNode) {
        finaleSpineNode.setAttribute('cx', spineSvgX);
      }

      const screenRightSvgX = Math.max(
        SVG_VIEWBOX_WIDTH,
        Math.round((window.innerWidth - svgRect.left) * scaleX + 120)
      );
      const branchPath = `M ${spineSvgX} 150 H ${screenRightSvgX}`;
      if (finaleBranchTrack) finaleBranchTrack.setAttribute('d', branchPath);
      if (finaleBranchRight) finaleBranchRight.setAttribute('d', branchPath);

      // Anchor bottom of spineTrack cleanly at the finale junction node (y=150 in viewBox)
      if (pageShell) {
        const shellRect = pageShell.getBoundingClientRect();
        const junctionViewportY = svgRect.top + (150 / SVG_VIEWBOX_HEIGHT) * svgRect.height;
        const bottomPx = Math.max(16, Math.round(shellRect.bottom - junctionViewportY));
        spineTrack.style.bottom = `${bottomPx}px`;
      }
    }

    const sectionRecords = Array.from(document.querySelectorAll('.section')).map(el => ({
      id: el.id,
      el,
      header: el.querySelector('.section-header'),
      toggleBtn: el.querySelector('.section-toggle'),
      title: el.querySelector('.spine-title'),
      meta: el.querySelector('.section-meta'),
      groups: Array.from(el.querySelectorAll('.links-grid')).map(grid => ({
        grid,
        heading: grid.previousElementSibling,
        countEl: grid.previousElementSibling ? grid.previousElementSibling.querySelector('.group-count') : null,
        cards: Array.from(grid.querySelectorAll('.link-card'))
      })),
      allCards: Array.from(el.querySelectorAll('.link-card'))
    }));

    function updateBottomRunway() {
      if (!pageShell || !spineFinale) return;
      const visibleRecords = sectionRecords.filter(r => r.el.style.display !== 'none');

      if (visibleRecords.length === 0) {
        spineFinale.style.display = 'none';
        if (spineTrack) spineTrack.style.bottom = '24px';
        return;
      }

      spineFinale.style.display = 'flex';
      spineFinale.style.minHeight = '';
      syncFinaleSpineAlignment();
    }

    // 6. Collapse State & Navigation
    function setSectionCollapsed(record, isCollapsed) {
      record.el.classList.toggle('is-collapsed', isCollapsed);
      if (record.toggleBtn) {
        record.toggleBtn.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
      }
    }

    function clearNavPin() {
      navPinnedSectionId = '';
      navTargetScrollY = null;
      if (navPinTimer) {
        clearTimeout(navPinTimer);
        navPinTimer = null;
      }
    }

    sectionRecords.forEach(record => {
      if (!record.header) return;

      const toggleSection = () => {
        const nextCollapsed = !record.el.classList.contains('is-collapsed');
        setSectionCollapsed(record, nextCollapsed);
        if (nextCollapsed) {
          collapsedSectionIds.add(record.id);
        } else {
          collapsedSectionIds.delete(record.id);
        }
        saveStoredSet('toxico_collapsed', collapsedSectionIds);
        updateBottomRunway();
        scheduleScrollUpdate();
      };

      record.header.addEventListener('click', toggleSection);
    });

    if (brandLink) {
      brandLink.addEventListener('click', (e) => {
        e.preventDefault();
        const firstVisible = sectionRecords.find(r => r.el.style.display !== 'none');
        navPinnedSectionId = firstVisible ? firstVisible.id : '';
        navTargetScrollY = 0;
        if (navPinTimer) clearTimeout(navPinTimer);
        navPinTimer = setTimeout(() => {
          clearNavPin();
          scheduleScrollUpdate();
        }, 1500);

        if (location.hash !== '#top') {
          history.pushState(null, '', '#top');
        }
        window.scrollTo({ top: 0, behavior: getScrollBehavior() });
        scheduleScrollUpdate();
      });
    }

    navLinks.forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const targetId = link.getAttribute('data-target');
        const targetRecord = sectionRecords.find(r => r.id === targetId);
        if (!targetRecord) return;

        if (targetRecord.el.style.display === 'none' && (searchInput.value || onlyFavorites || statusFilter !== 'all')) {
          searchInput.value = '';
          onlyFavorites = false;
          statusFilter = 'all';
          syncStatusFilterUI();
          applyFilters();
        }

        if (targetRecord.el.classList.contains('is-collapsed')) {
          setSectionCollapsed(targetRecord, false);
          collapsedSectionIds.delete(targetRecord.id);
          saveStoredSet('toxico_collapsed', collapsedSectionIds);
        }

        updateBottomRunway();

        const targetOffset = getTopBarOffset();
        const headerEl = targetRecord.header || targetRecord.el;
        const headerRect = headerEl.getBoundingClientRect();
        const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        const rawTargetY = Math.max(0, Math.round(window.scrollY + headerRect.top - targetOffset));
        const targetScrollY = Math.min(maxScroll, rawTargetY);

        navPinnedSectionId = targetRecord.id;
        navTargetScrollY = targetScrollY;
        if (navPinTimer) clearTimeout(navPinTimer);
        navPinTimer = setTimeout(() => {
          clearNavPin();
          scheduleScrollUpdate();
        }, 1500);

        if (location.hash !== '#' + targetId) {
          history.pushState(null, '', '#' + targetId);
        }
        window.scrollTo({ top: targetScrollY, behavior: getScrollBehavior() });
        scheduleScrollUpdate();
      });
    });

    window.addEventListener('scrollend', () => {
      clearNavPin();
      scheduleScrollUpdate();
    });
    window.addEventListener('wheel', clearNavPin, { passive: true });
    window.addEventListener('touchmove', clearNavPin, { passive: true });
    window.addEventListener('keydown', (e) => {
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) {
        return;
      }
      const navKeys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' '];
      if (navKeys.includes(e.key)) {
        clearNavPin();
      }
    }, { passive: true });

    // 7. Event Delegation for Cards
    function markCardVisited(card) {
      if (!card) return;
      const key = card.dataset.key;
      if (!visitedHrefs.has(key)) {
        visitedHrefs.add(key);
        saveStoredSet('toxico_visited', visitedHrefs);
      }
      if (!card.classList.contains('visited')) {
        card.classList.add('visited');
        const contentSpan = card.querySelector('.card-content');
        if (contentSpan && !contentSpan.querySelector('.tag-visited')) {
          const tag = document.createElement('span');
          tag.className = 'tag-visited';
          tag.textContent = 'Visited';
          contentSpan.appendChild(tag);
        }
      }
      updateWorkbenchMetrics();
      if (statusFilter === 'unread' || statusFilter === 'visited') {
        applyFilters();
      }
    }

    sectionsRoot.addEventListener('click', (e) => {
      const favBtn = e.target.closest('.fav-btn');
      if (favBtn) {
        e.preventDefault();
        e.stopPropagation();
        const card = favBtn.closest('.link-card');
        if (!card) return;
        const key = card.dataset.key;
        const isFav = !favoriteHrefs.has(key);
        if (isFav) {
          favoriteHrefs.add(key);
        } else {
          favoriteHrefs.delete(key);
        }
        saveStoredSet('toxico_favorites', favoriteHrefs);
        favBtn.classList.toggle('is-favorite', isFav);
        const label = isFav ? 'Remove from favorites' : 'Add to favorites';
        favBtn.setAttribute('aria-label', label);
        favBtn.setAttribute('aria-pressed', isFav ? 'true' : 'false');
        favBtn.title = label;
        updateWorkbenchMetrics();
        if (onlyFavorites || statusFilter === 'favorites') applyFilters();
        return;
      }

      const cardLink = e.target.closest('.card-link');
      if (cardLink) {
        markCardVisited(cardLink.closest('.link-card'));
      }
    });

    sectionsRoot.addEventListener('auxclick', (e) => {
      if (e.button !== 1 || e.target.closest('.fav-btn')) return;
      const cardLink = e.target.closest('.card-link');
      if (cardLink) {
        markCardVisited(cardLink.closest('.link-card'));
      }
    });

    // Inline Two-Step Reset History
    let resetConfirmTimer = null;
    const DEFAULT_RESET_LABEL = 'Reset visited links history';
    const CONFIRM_RESET_LABEL = 'Press again to confirm reset';

    resetHistoryBtn.addEventListener('click', () => {
      if (!resetHistoryBtn.classList.contains('is-confirming')) {
        resetHistoryBtn.classList.add('is-confirming');
        resetHistoryBtn.setAttribute('aria-label', CONFIRM_RESET_LABEL);
        resetHistoryBtn.title = CONFIRM_RESET_LABEL;
        if (resetHistoryLabel) resetHistoryLabel.style.display = 'inline';
        if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
        resetConfirmTimer = setTimeout(() => {
          resetHistoryBtn.classList.remove('is-confirming');
          resetHistoryBtn.setAttribute('aria-label', DEFAULT_RESET_LABEL);
          resetHistoryBtn.title = DEFAULT_RESET_LABEL;
          if (resetHistoryLabel) resetHistoryLabel.style.display = 'none';
        }, 3000);
        return;
      }

      if (resetConfirmTimer) clearTimeout(resetConfirmTimer);
      resetHistoryBtn.classList.remove('is-confirming');
      resetHistoryBtn.setAttribute('aria-label', DEFAULT_RESET_LABEL);
      resetHistoryBtn.title = DEFAULT_RESET_LABEL;
      if (resetHistoryLabel) resetHistoryLabel.style.display = 'none';

      try {
        localStorage.removeItem('toxico_visited');
      } catch (_) {}
      visitedHrefs.clear();
      linkCards.forEach(card => {
        card.classList.remove('visited');
        const tag = card.querySelector('.tag-visited');
        if (tag) tag.remove();
      });
      updateWorkbenchMetrics();
      if (statusFilter === 'visited' || statusFilter === 'unread') {
        applyFilters();
      }
    });

    // 8. Unified Filtering & Search
    function syncStatusFilterUI() {
      favoritesFilterBtn.classList.toggle('is-active', onlyFavorites);
      favoritesFilterBtn.setAttribute('aria-pressed', onlyFavorites ? 'true' : 'false');
      statusFilterBtns.forEach(btn => {
        const mode = btn.getAttribute('data-status-filter');
        const active = (onlyFavorites && mode === 'favorites') || (!onlyFavorites && mode === statusFilter);
        btn.classList.toggle('is-active', active);
      });
    }

    function normalizeSearchText(str) {
      return (str || '')
        .normalize('NFC')
        .toLowerCase()
        .replace(/\s+/g, ' ')
        .trim();
    }

    function applyFilters() {
      const rawQuery = searchInput.value;
      const normalizedQuery = normalizeSearchText(rawQuery);
      const queryTokens = normalizedQuery ? normalizedQuery.split(' ').filter(Boolean) : [];
      const effectiveStatus = onlyFavorites ? 'favorites' : statusFilter;
      const isFiltering = Boolean(queryTokens.length > 0 || effectiveStatus !== 'all');
      let anySectionVisible = false;

      sectionRecords.forEach(record => {
        setSectionCollapsed(record, isFiltering ? false : collapsedSectionIds.has(record.id));
        let visibleCardsCount = 0;
        const sectionTitleText = normalizeSearchText(record.title ? record.title.textContent : '');

        record.groups.forEach(({ grid, heading, countEl, cards }) => {
          const groupTitleText = normalizeSearchText(heading ? heading.textContent : '');
          let groupVisibleCount = 0;

          cards.forEach(card => {
            const key = card.dataset.key;
            let statusMatch = true;
            if (effectiveStatus === 'favorites') {
              statusMatch = favoriteHrefs.has(key);
            } else if (effectiveStatus === 'visited') {
              statusMatch = visitedHrefs.has(key);
            } else if (effectiveStatus === 'unread') {
              statusMatch = !visitedHrefs.has(key);
            }

            let textMatch = true;
            if (queryTokens.length > 0) {
              const cardTitleText = normalizeSearchText(card.dataset.search || '');
              const searchableCombined = `${cardTitleText} ${groupTitleText} ${sectionTitleText}`;
              textMatch = queryTokens.every(token => searchableCombined.includes(token));
            }

            const match = statusMatch && textMatch;
            card.style.display = match ? '' : 'none';
            if (match) {
              groupVisibleCount++;
              visibleCardsCount++;
            }
          });

          const hasVisibleCard = groupVisibleCount > 0;
          if (heading) heading.style.display = hasVisibleCard ? '' : 'none';
          if (countEl) countEl.textContent = isFiltering ? `${groupVisibleCount} / ${cards.length}` : `${cards.length}`;
          grid.style.display = hasVisibleCard ? '' : 'none';
        });

        const hasVisibleGrid = visibleCardsCount > 0;
        record.el.style.display = hasVisibleGrid ? '' : 'none';

        if (record.meta && record.meta.dataset.unit) {
          const total = record.allCards.length;
          record.meta.textContent = isFiltering
            ? `${visibleCardsCount} / ${total} ${record.meta.dataset.unit}`
            : `${total} ${record.meta.dataset.unit}`;
        }

        if (hasVisibleGrid) anySectionVisible = true;
      });

      if (!anySectionVisible) {
        if (effectiveStatus === 'favorites' && !queryTokens.length) {
          emptyStateText.textContent = 'No favorite resources yet. Click the star icon on any card to bookmark it.';
          clearSearchBtn.textContent = 'Show all resources';
        } else if (effectiveStatus === 'visited' && !queryTokens.length) {
          emptyStateText.textContent = 'No reviewed resources yet. Open any lecture, protocol, or paper to track progress.';
          clearSearchBtn.textContent = 'Show all resources';
        } else {
          emptyStateText.textContent = 'No resources match your current filter.';
          clearSearchBtn.textContent = 'Clear filter';
        }
      }
      emptyState.style.display = anySectionVisible ? 'none' : 'block';
      updateWorkbenchMetrics();
      updateBottomRunway();
      scheduleScrollUpdate();
    }

    favoritesFilterBtn.addEventListener('click', () => {
      onlyFavorites = !onlyFavorites;
      statusFilter = onlyFavorites ? 'favorites' : 'all';
      syncStatusFilterUI();
      applyFilters();
    });

    statusFilterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.getAttribute('data-status-filter') || 'all';
        statusFilter = mode;
        onlyFavorites = mode === 'favorites';
        syncStatusFilterUI();
        applyFilters();
      });
    });

    searchInput.addEventListener('input', applyFilters);

    clearSearchBtn.addEventListener('click', () => {
      searchInput.value = '';
      onlyFavorites = false;
      statusFilter = 'all';
      syncStatusFilterUI();
      applyFilters();
      searchInput.focus();
    });

    window.addEventListener('keydown', (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : '';
      const isEditable = tag === 'INPUT' || tag === 'TEXTAREA' || (document.activeElement && document.activeElement.isContentEditable);
      if (e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey && !isEditable) {
        e.preventDefault();
        searchInput.focus();
      } else if (e.key === 'Escape' && document.activeElement === searchInput) {
        searchInput.value = '';
        applyFilters();
        searchInput.blur();
      }
    });

    // 9. Structured Scroll Progress & Pipeline (Read Phase then Write Phase)
    let rafPending = false;

    function updateScrollProgress() {
      rafPending = false;
      if (!spineTrack || !spineFill) return;

      // READ PHASE
      const scrollY = window.scrollY;
      const innerHeight = window.innerHeight;
      const scrollHeight = document.documentElement.scrollHeight;

      if (navPinnedSectionId && navTargetScrollY !== null) {
        if (Math.abs(scrollY - navTargetScrollY) <= 2) {
          clearNavPin();
        }
      }

      const targetOffset = getTopBarOffset();
      const headerThresholdY = targetOffset + 12;
      const trackRect = spineTrack.getBoundingClientRect();
      const trackHeight = Math.max(1, spineTrack.offsetHeight);
      const visibleRecords = sectionRecords.filter(r => r.el.style.display !== 'none');

      let thresholdRecord = visibleRecords.length > 0 ? visibleRecords[0] : null;
      const recordMetrics = visibleRecords.map(record => {
        const headerEl = record.header || record.el;
        const hRect = headerEl.getBoundingClientRect();
        if (hRect.top <= headerThresholdY) {
          thresholdRecord = record;
        }
        const tRect = record.title ? record.title.getBoundingClientRect() : null;
        return { record, hRect, tRect };
      });

      const maxScroll = Math.max(0, scrollHeight - innerHeight);
      // When scrolled near the bottom of the page, activate the last visible section naturally
      if (!navPinnedSectionId && maxScroll > 0 && scrollY >= maxScroll - 24 && visibleRecords.length > 0) {
        thresholdRecord = visibleRecords[visibleRecords.length - 1];
      }

      const activeRecord = (navPinnedSectionId && visibleRecords.find(r => r.id === navPinnedSectionId)) || thresholdRecord;
      const activeSectionId = activeRecord ? activeRecord.id : '';

      const activeMetric = recordMetrics.find(m => m.record === activeRecord) || recordMetrics[0];
      const refHeaderHeight = activeMetric && activeMetric.hRect ? activeMetric.hRect.height : 52;
      const anchorViewportY = targetOffset + refHeaderHeight;

      const firstHeaderBottom = recordMetrics.length > 0 && recordMetrics[0].hRect
        ? recordMetrics[0].hRect.bottom
        : anchorViewportY;

      let lineTipViewportY = Math.max(anchorViewportY, firstHeaderBottom);

      const finaleSvgVisible = Boolean(spineFinale && finaleSvg && spineFinale.style.display !== 'none');
      const finaleSvgRect = finaleSvgVisible ? finaleSvg.getBoundingClientRect() : null;

      // Smoothly map the final 240px of scroll into the finale cat & flask junction without requiring blank padding
      const tailZone = Math.min(240, Math.max(80, maxScroll * 0.25));
      const tailStart = Math.max(0, maxScroll - tailZone);
      if (!navPinnedSectionId && maxScroll > 0 && scrollY > tailStart) {
        const tailRatio = Math.min(1, Math.max(0, (scrollY - tailStart) / Math.max(1, maxScroll - tailStart)));
        const targetEndViewportY = finaleSvgRect ? finaleSvgRect.bottom + 8 : innerHeight;
        lineTipViewportY = lineTipViewportY + tailRatio * Math.max(0, targetEndViewportY - lineTipViewportY);
      }

      if (navPinnedSectionId && activeMetric && activeMetric.hRect) {
        lineTipViewportY = Math.max(lineTipViewportY, activeMetric.hRect.bottom);
      }

      const headingMetrics = allHeadings
        .filter(h3 => h3.style.display !== 'none' && h3.offsetParent !== null)
        .map(h3 => ({ h3, rect: h3.getBoundingClientRect() }));

      // COMPUTATION
      const lineTipY = Math.min(trackHeight, Math.max(0, lineTipViewportY - trackRect.top));

      let tipSvgY = 0;
      let dashOffset = 1000;
      if (finaleSvgRect) {
        const svgHeight = Math.max(1, finaleSvgRect.height);
        tipSvgY = ((lineTipViewportY - finaleSvgRect.top) / svgHeight) * SVG_VIEWBOX_HEIGHT;
        const branchProgress = Math.min(1, Math.max(0, (tipSvgY - 150) / 46));
        dashOffset = Math.round((1 - branchProgress) * 1000);
      }

      // WRITE PHASE
      spineFill.style.height = `${lineTipY}px`;

      if (finaleSvgVisible) {
        spineFinale.classList.toggle('is-cat-reached', tipSvgY >= 150);
        spineFinale.classList.toggle('is-end-reached', tipSvgY >= 196);
        if (finaleBranchRight) finaleBranchRight.style.strokeDashoffset = `${dashOffset}`;
      }

      recordMetrics.forEach(({ record, hRect, tRect }) => {
        const titleReached = tRect ? (lineTipViewportY >= tRect.top + tRect.height * 0.55) : false;
        record.el.classList.toggle('is-reached', titleReached || record.id === activeSectionId);
        record.el.classList.toggle('is-border-reached', lineTipViewportY >= hRect.bottom - 1);
        record.el.classList.toggle('is-active', record.id === activeSectionId);
      });

      sectionRecords.forEach(record => {
        if (record.el.style.display === 'none') {
          record.el.classList.remove('is-reached', 'is-active', 'is-border-reached');
        }
      });

      navLinks.forEach(link => {
        link.classList.toggle('is-active', link.getAttribute('data-target') === activeSectionId);
      });

      headingMetrics.forEach(({ h3, rect }) => {
        h3.classList.toggle('is-reached', lineTipViewportY >= rect.top + rect.height * 0.55);
      });
    }

    function scheduleScrollUpdate() {
      if (!rafPending) {
        rafPending = true;
        window.requestAnimationFrame(updateScrollProgress);
      }
    }

    window.addEventListener('scroll', scheduleScrollUpdate, { passive: true });
    window.addEventListener('resize', () => {
      updateBottomRunway();
      scheduleScrollUpdate();
    }, { passive: true });

    // 10. Performance Observers
    if ('IntersectionObserver' in window && spineFinale) {
      const finaleObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          spineFinale.classList.toggle('is-paused', !entry.isIntersecting);
        });
      }, { rootMargin: '100px' });
      finaleObserver.observe(spineFinale);
    }

    if ('ResizeObserver' in window && sectionsRoot) {
      const sectionsObserver = new ResizeObserver(() => {
        updateBottomRunway();
        scheduleScrollUpdate();
      });
      sectionsObserver.observe(sectionsRoot);
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        updateBottomRunway();
        scheduleScrollUpdate();
      });
    }

    // 11. Initial View & Deep Link Resolution
    applyFilters();

    function navigateToHash(instant = false) {
      const hashId = location.hash.replace(/^#/, '');
      if (!hashId || hashId === 'top') {
        clearNavPin();
        window.scrollTo({ top: 0, behavior: instant ? 'instant' : getScrollBehavior() });
        scheduleScrollUpdate();
        return;
      }

      const targetRecord = sectionRecords.find(r => r.id === hashId);
      if (!targetRecord) return;

      if (targetRecord.el.classList.contains('is-collapsed')) {
        setSectionCollapsed(targetRecord, false);
        collapsedSectionIds.delete(targetRecord.id);
        saveStoredSet('toxico_collapsed', collapsedSectionIds);
      }

      if (targetRecord.el.style.display === 'none' && (searchInput.value || onlyFavorites || statusFilter !== 'all')) {
        searchInput.value = '';
        onlyFavorites = false;
        statusFilter = 'all';
        syncStatusFilterUI();
        applyFilters();
      }

      updateBottomRunway();

      requestAnimationFrame(() => {
        const targetOffset = getTopBarOffset();
        const headerEl = targetRecord.header || targetRecord.el;
        const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
        const targetScrollY = Math.min(maxScroll, Math.max(0, Math.round(window.scrollY + headerEl.getBoundingClientRect().top - targetOffset)));

        navPinnedSectionId = targetRecord.id;
        navTargetScrollY = targetScrollY;
        if (navPinTimer) clearTimeout(navPinTimer);
        navPinTimer = setTimeout(() => {
          clearNavPin();
          scheduleScrollUpdate();
        }, 1500);

        window.scrollTo({ top: targetScrollY, behavior: instant ? 'instant' : getScrollBehavior() });
        scheduleScrollUpdate();
      });
    }

    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }

    if (location.hash) {
      navigateToHash(true);
    }

    window.addEventListener('hashchange', () => navigateToHash(true));
  </script>
</body>
